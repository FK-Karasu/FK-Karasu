<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Вход - {{ system_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon.png') }}">
    {% include '_pwa_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2026110201">
    <style>
        .portal-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            z-index: 3;
        }
        .portal-login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 24px;
            padding: 32px;
            color: #f8f7f6;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }
        .portal-login-card h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f8f7f6;
        }
        .portal-login-card p { color: rgba(248,250,252,0.7); margin-bottom: 24px; }
        .portal-login-card label { display:block; margin-bottom:6px; font-weight:600; }
        .portal-login-card input {
            width:100%;
            padding:12px 14px;
            border-radius: 12px;
            border:1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color:#fff;
            margin-bottom:16px;
        }
        .portal-login-card button {
            width:100%;
            padding:12px 14px;
            border-radius: 12px;
            border:none;
            background: linear-gradient(135deg,#d96f00,#4f46e5);
            color:#fff;
            font-weight:700;
            cursor:pointer;
            box-shadow: 0 8px 20px rgba(79,70,229,0.35);
        }
        .portal-login-error { margin-top:12px; color:#fca5a5; }
    </style>
</head>
<body class="login-page">
    <img class="login-bg-image" src="{{ url_for('static', filename='uploads/poster-login.jpg') }}" alt="" aria-hidden="true">
    <div class="portal-login">
        <div class="portal-login-card">
            <div class="login-brand" style="margin-bottom: 10px;">
                <img class="login-logo" src="{{ system_logo_url }}" alt="{{ system_name }}">
            </div>
            <h1>Вход для родителей/учеников</h1>
            <p>Введите номер телефона и код из Telegram.</p>
            <form id="portalLoginForm">
                <label>Номер телефона</label>
                <input type="text" id="portal-phone" placeholder="+998..." required>
                <label>Код (Telegram)</label>
                <input type="text" id="portal-code" placeholder="A001" required>
                <button type="submit">Войти</button>
                <div id="portal-login-error" class="portal-login-error"></div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('portalLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('portal-phone').value.trim();
            const code = document.getElementById('portal-code').value.trim();
            const errorEl = document.getElementById('portal-login-error');
            errorEl.textContent = '';
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, code, portal: true })
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = data.redirect || '/portal';
                } else {
                    errorEl.textContent = data.message || 'Ошибка входа';
                }
            } catch (err) {
                errorEl.textContent = 'Ошибка соединения';
            }
        });
    </script>
    <script src="{{ url_for('static', filename='js/service-lock-overlay.js') }}"></script>
</body>
</html>
