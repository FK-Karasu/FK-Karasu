<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Табель сотрудников - {{ system_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon.png') }}">
    {% include '_pwa_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2026111001">
    <style>
        .staff-timesheet-page {
            background: #f4f1ee;
            min-height: 100vh;
        }

        .staff-timesheet-shell {
            padding: 22px 18px;
        }

        .staff-timesheet-panel {
            background: #fff;
            border: 1px solid #d8e2ef;
            border-radius: 8px;
            padding: 18px;
        }

        .staff-timesheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 16px;
        }

        .staff-timesheet-title {
            display: flex;
            align-items: center;
            gap: 8px !important;
            color: #5f6673 !important;
            font-size: 18px !important;
            font-weight: 600 !important;
            line-height: 22px !important;
            margin: 0 !important;
        }

        .staff-timesheet-title svg {
            width: 18px !important;
            height: 18px !important;
            color: #5f6673 !important;
            stroke: currentColor !important;
        }

        .staff-timesheet-filters {
            display: grid;
            grid-template-columns: minmax(180px, 320px) 150px 120px auto auto;
            gap: 10px;
            align-items: center;
        }

        .staff-timesheet-filters input,
        .staff-timesheet-filters select {
            height: 40px;
            border: 1px solid #ccd8e8;
            border-radius: 8px;
            padding: 0 12px;
            color: #0f1f37;
            background: #fff;
            font-size: 14px;
        }

        .staff-timesheet-filters button {
            height: 40px;
            border: 1px solid #cbd8ea;
            border-radius: 8px;
            background: #ff8a00;
            color: #fff;
            padding: 0 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .staff-timesheet-filters .btn-export {
            background: #f8f7f6;
            color: #334155;
        }

        .staff-timesheet-filters .btn-icon {
            width: 40px;
            min-width: 40px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .staff-timesheet-filters .btn-icon svg {
            width: 16px;
            height: 16px;
        }

        .staff-timesheet-scroll {
            overflow: auto;
            border: 0;
            border-radius: 0;
            max-height: calc(100vh - 175px);
            scrollbar-width: thin;
            scrollbar-color: #d8d0c8 #f8f7f6;
        }

        .staff-timesheet-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .staff-timesheet-scroll::-webkit-scrollbar-track {
            background: #f8f7f6;
        }

        .staff-timesheet-scroll::-webkit-scrollbar-thumb {
            background: #d8d0c8;
            border-radius: 999px;
        }

        .staff-timesheet-table {
            width: max-content;
            min-width: 100%;
            border-collapse: collapse !important;
            border-spacing: 0;
            font-size: 11px;
            color: #17233a;
        }

        .staff-timesheet-table th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #f8f7f6;
            color: #5f6673;
            border-right: 1px solid #e4ddd6;
            border-bottom: 1px solid #d8e2ef;
            padding: 6px 5px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
        }

        .staff-timesheet-table td {
            background: #fff;
            border-right: 1px solid #e1e8f2;
            border-bottom: 1px solid #e1e8f2;
            padding: 5px 6px;
            vertical-align: middle;
            font-weight: 400;
        }

        .staff-timesheet-table .sticky-col {
            position: sticky;
            z-index: 2;
            background: #fff;
        }

        .staff-timesheet-table th.sticky-col {
            z-index: 4;
            background: #f8f7f6;
        }

        .staff-timesheet-table .col-index {
            left: 0;
            width: 34px;
            min-width: 34px;
            text-align: center;
        }

        .staff-timesheet-table .col-photo {
            left: 34px;
            width: 36px;
            min-width: 36px;
            text-align: center;
        }

        .staff-timesheet-table .col-name {
            left: 70px;
            width: 150px;
            min-width: 150px;
        }

        .staff-photo {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            background: #eef3f9;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-weight: 500;
            font-size: 11px;
        }

        .staff-name {
            font-size: 11px;
            font-weight: 400;
            color: #0f1f37;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .staff-sub {
            color: #718198;
            font-size: 10px;
            margin-top: 2px;
        }

        .staff-role-sub {
            color: #8a9099;
            font-size: 10px;
            line-height: 1.2;
        }

        .day-cell {
            width: 32px;
            min-width: 32px;
            height: 38px;
            text-align: center;
            background: #fde2e2 !important;
        }

        .day-cell.weekend {
            background: #e9eef4 !important;
        }

        .day-cell.has-data {
            background: #eef7ff !important;
        }

        .day-cell .time {
            display: block;
            color: #0f1f37;
            line-height: 1.2;
            font-size: 9px;
        }

        .day-cell .hours {
            display: inline-block;
            margin-top: 3px;
            color: #ff8a00;
            font-size: 9px;
        }

        .summary-cell {
            min-width: 58px;
            text-align: center;
            color: #0f1f37;
            font-weight: 400 !important;
        }

        .salary-cell {
            min-width: 108px;
            color: #0f1f37;
            white-space: nowrap;
            font-size: 10px;
        }

        .salary-paid {
            color: #159447;
            font-weight: 400;
        }

        .salary-muted {
            color: #8a98aa;
        }

        .timesheet-empty {
            text-align: center;
            color: #718198;
            padding: 32px !important;
        }

        @media (max-width: 900px) {
            .staff-timesheet-filters {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body class="staff-timesheet-page">
    {% include '_sidebar.html' %}

    <main class="main-content">
        <div class="staff-timesheet-shell">
            <section class="staff-timesheet-panel">
                <div class="staff-timesheet-header">
                    <h1 class="staff-timesheet-title">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8 2v4" />
                            <path d="M16 2v4" />
                            <rect width="18" height="18" x="3" y="4" rx="2" />
                            <path d="M3 10h18" />
                            <path d="M8 14h.01" />
                            <path d="M12 14h.01" />
                            <path d="M16 14h.01" />
                            <path d="M8 18h.01" />
                            <path d="M12 18h.01" />
                        </svg>
                        Табель сотрудников
                    </h1>
                    <div class="staff-timesheet-filters">
                        <input id="staff-timesheet-search" type="search" placeholder="ФИО...">
                        <select id="staff-timesheet-month"></select>
                        <select id="staff-timesheet-year"></select>
                        <button id="staff-timesheet-refresh" class="btn-icon" type="button" title="Обновить" aria-label="Обновить">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                aria-hidden="true">
                                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                                <path d="M3 21v-5h5" />
                                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                                <path d="M16 8h5V3" />
                            </svg>
                        </button>
                        <button id="staff-timesheet-export" class="btn-export" type="button">Скачать XLS</button>
                    </div>
                </div>

                <div class="staff-timesheet-scroll">
                    <table class="staff-timesheet-table" id="staff-timesheet-table">
                        <thead></thead>
                        <tbody>
                            <tr>
                                <td class="timesheet-empty">Загрузка...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/staff_timesheet.js') }}?v=2026071501"></script>
</body>

</html>
