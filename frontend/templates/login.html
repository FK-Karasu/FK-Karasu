<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Вход - {{ system_name }}</title>
    <link href="{{ url_for('static', filename='vendor/onest/onest.css') }}" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon.png') }}">
    {% include '_pwa_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2026071502">
</head>
<body class="login-page">
    <img class="login-bg-image" src="{{ url_for('static', filename='uploads/poster-login.jpg') }}" alt="" aria-hidden="true">
    <div class="login-container">
        <div class="login-box">
            <div class="login-brand">
                <img class="login-logo" src="{{ system_logo_url }}" alt="{{ system_name }}">
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="form-group">
                    <label>Пароль</label>
                    <div class="password-field">
                        <input type="password" id="password" required>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Показать пароль">
                            <svg data-eye-icon xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg data-eye-off-icon xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
                                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
                                <path d="m2 2 20 20" />
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Войти</button>
                <div class="login-divider" aria-hidden="true"><span>или</span></div>
                <a class="google-login-btn" href="{{ url_for('google_login') }}" aria-label="Google" title="Google">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.5 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.2 13.6 17.5 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.6c-.5 2.9-2.2 5.4-4.7 7.1l7.3 5.7c4.3-4 7.3-9.9 7.3-16.8z"/>
                        <path fill="#FBBC05" d="M10.4 28.7A14.7 14.7 0 0 1 9.6 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.6 2.6 10.8l7.8-6.1z"/>
                        <path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.3-5.7c-2 1.4-4.7 2.2-8.7 2.2-6.5 0-11.8-4.1-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
                    </svg>
                </a>
                <a href="#" id="forgotPasswordBtn" class="login-link-btn">Забыли пароль?</a>
                <div id="error-message" class="error"></div>
            </form>
            <form id="forgotPasswordForm" style="display:none;">
                <div class="form-group">
                    <label>Электронная почта</label>
                    <input type="email" id="forgot-email" required>
                </div>
                <button type="submit" class="btn-primary">Отправить ссылку</button>
                <a href="#" class="login-link-btn" id="backToLoginFromForgot">Вернуться ко входу</a>
                <div id="forgot-message" class="error"></div>
            </form>
            <form id="resetPasswordForm" data-reset-token="{{ reset_token or '' }}" style="display:none;">
                <div class="form-group">
                    <label>Новый пароль</label>
                    <input type="password" id="reset-new-password" required>
                </div>
                <div class="form-group">
                    <label>Подтвердить пароль</label>
                    <input type="password" id="reset-confirm-password" required>
                </div>
                <button type="submit" class="btn-primary">Сохранить пароль</button>
                <div id="reset-message" class="error"></div>
            </form>
            <div class="login-legal-links">
                <a href="{{ url_for('public_tournaments_page') }}">Турниры</a>
                <a href="{{ url_for('legal_page', section='privacy', lang='ru') }}" target="_blank">Конфиденциальность</a>
                <a href="{{ url_for('legal_page', section='offer', lang='ru') }}" target="_blank">Соглашение</a>
                <a href="{{ url_for('legal_page', section='refund', lang='ru') }}" target="_blank">Оплата и возврат</a>
            </div>
        </div>
    </div>

    <div class="login-ticker" aria-label="Контакты поддержки">
        <div class="login-ticker-track">
            <span id="login-ticker-text"></span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}?v=2026101601"></script>
    <script src="{{ url_for('static', filename='js/service-lock-overlay.js') }}"></script>
</body>
</html>
