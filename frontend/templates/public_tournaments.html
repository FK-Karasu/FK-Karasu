<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Турниры — {{ system_name }}</title>
    <meta name="description" content="Афиша футбольных турниров {{ system_name }}: предстоящие соревнования и архив прошедших.">
    <meta name="theme-color" content="#ff8a00">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='pwa/icon-192.png') }}">
    {% include '_pwa_head.html' %}
    <link href="{{ url_for('static', filename='vendor/onest/onest.css') }}" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --line: #e4ddd6;
            --muted: #6b7280;
            --accent: #ff8a00;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            padding-bottom: calc(32px + env(safe-area-inset-bottom));
            background: linear-gradient(135deg, #f4f1ee 0%, #e8e1da 100%);
            color: #17191f;
            font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        .wrap {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 14px;
        }

        .topbar {
            margin-bottom: 20px;
            padding: calc(16px + env(safe-area-inset-top)) 0 16px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .topbar .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            text-decoration: none;
            color: inherit;
        }

        .brand img { height: 40px; width: auto; }

        .login-link {
            flex: 0 0 auto;
            padding: 9px 16px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: #f8f7f6;
            color: #444a54;
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
            white-space: nowrap;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 26px;
            line-height: 1.2;
        }

        .lead {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 14.5px;
        }

        .tabs {
            display: inline-flex;
            gap: 4px;
            margin-bottom: 18px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }

        .tabs button {
            min-height: 38px;
            padding: 0 16px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #5f6673;
            font: inherit;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
        }

        .tabs button.active {
            background: #fff5eb;
            color: #b45f09;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .card {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            overflow: hidden;
        }

        .card-photo {
            position: relative;
            height: 150px;
            background: #efe9e3 center/cover no-repeat;
        }

        .card-photo.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b9b2ab;
        }

        .card-photo.empty svg { width: 42px; height: 42px; }

        .card-date {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 11px;
            border-radius: 999px;
            background: rgba(23, 25, 31, .78);
            color: #fff;
            font-size: 12.5px;
            font-weight: 650;
        }

        .card-body {
            display: grid;
            gap: 10px;
            padding: 15px 16px 17px;
        }

        .card h2 {
            margin: 0;
            font-size: 17px;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .meta {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 13.5px;
        }

        .meta div {
            display: flex;
            align-items: flex-start;
            gap: 7px;
        }

        .meta svg {
            flex: 0 0 auto;
            width: 15px;
            height: 15px;
            margin-top: 2px;
        }

        .ages {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .age {
            padding: 3px 10px;
            border: 1px solid #ffd9b0;
            border-radius: 999px;
            background: #fff5eb;
            color: #b45f09;
            font-size: 12.5px;
            font-weight: 650;
        }

        .map-link {
            color: var(--accent);
            font-size: 13px;
            font-weight: 650;
            text-decoration: none;
        }

        .credit {
            color: #a8a29b;
            font-size: 11px;
        }

        .empty-state {
            padding: 40px 16px;
            border: 1px dashed var(--line);
            border-radius: 16px;
            background: #fff;
            color: var(--muted);
            text-align: center;
        }

        .card.finished .card-photo { filter: grayscale(.55); }

        .card {
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(23, 25, 31, .10);
        }

        /* Окно с деталями турнира */
        .sheet {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 14px;
        }

        .sheet[hidden] { display: none; }

        .sheet-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(23, 25, 31, .55);
        }

        .sheet-box,
        .table-wrap {
            scrollbar-width: thin;
            scrollbar-color: rgba(23, 25, 31, .16) transparent;
        }

        .sheet-box::-webkit-scrollbar,
        .table-wrap::-webkit-scrollbar {
            width: 6px;
            height: 6px;
            background: transparent;
        }

        .sheet-box::-webkit-scrollbar-track,
        .table-wrap::-webkit-scrollbar-track {
            background: transparent;
        }

        .sheet-box::-webkit-scrollbar-thumb,
        .table-wrap::-webkit-scrollbar-thumb {
            min-height: 32px;
            border: 1px solid transparent;
            border-radius: 999px;
            background: rgba(23, 25, 31, .16);
            background-clip: padding-box;
        }

        .sheet-box::-webkit-scrollbar-thumb:hover,
        .table-wrap::-webkit-scrollbar-thumb:hover {
            background: rgba(23, 25, 31, .3);
            background-clip: padding-box;
        }

        .sheet-box {
            position: relative;
            width: min(960px, 100%);
            max-height: calc(100dvh - 40px);
            overflow-y: auto;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 24px 60px rgba(23, 25, 31, .28);
        }

        .sheet-close {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 2;
            width: 36px;
            height: 36px;
            min-height: 36px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, .92);
            color: #444a54;
            font-size: 22px;
            line-height: 1;
            box-shadow: 0 2px 8px rgba(23, 25, 31, .16);
        }

        .sheet-poster {
            height: 220px;
            background: #efe9e3 center/cover no-repeat;
        }

        .sheet-poster.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b9b2ab;
        }

        .sheet-poster.empty svg { width: 54px; height: 54px; }

        .sheet-body {
            display: grid;
            gap: 16px;
            padding: 20px 22px 24px;
        }

        .sheet-body h2 {
            margin: 0;
            font-size: 22px;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .sheet-teams h3 {
            margin: 0 0 10px;
            font-size: 14px;
            font-weight: 750;
        }

        .sheet-age + .sheet-age { margin-top: 16px; }

        .sheet-age-title {
            margin: 0 0 8px;
            color: #b45f09;
            font-size: 13px;
            font-weight: 750;
        }

        .sheet-team-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 8px;
        }

        .sheet-team {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: #fbfaf9;
            font-size: 14px;
            font-weight: 600;
        }

        .sheet-team span.logo {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 30px;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #f4f1ee;
            color: #9aa1ab;
            font-size: 11px;
            font-weight: 700;
            overflow: hidden;
        }

        .sheet-team img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cat-switch,
        .sheet-tabs,
        .view-switch {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #f8f7f6;
        }

        .cat-switch { margin-bottom: 10px; }

        .sheet-tabs { margin-bottom: 16px; }

        .view-switch { margin-bottom: 14px; }

        .cat-switch button,
        .sheet-tabs button,
        .view-switch button {
            min-height: 34px;
            padding: 0 14px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #5f6673;
            font: inherit;
            font-size: 13px;
            font-weight: 650;
            cursor: pointer;
        }

        .cat-switch button.active,
        .sheet-tabs button.active,
        .view-switch button.active {
            background: #fff;
            color: #b45f09;
            box-shadow: 0 1px 3px rgba(23, 25, 31, .08);
        }

        /* Сетка плей-офф рисуется библиотекой bracketry */
        .bracket-host {
            width: 100%;
        }

        .bracket-host .bracket-root .match-body {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
        }

        .bracket-host .bronze-title {
            display: block;
            padding-bottom: 4px;
            color: #b45f09;
            font-size: 11px;
            font-weight: 750;
            text-align: center;
        }

        .bracket-host .bk-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 22px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #f4f1ee;
            overflow: hidden;
        }

        .bracket-host .bk-logo img {
            width: 22px;
            height: 22px;
            object-fit: cover;
        }

        .bracket-host .bk-logo.empty {
            background: #efe9e3;
            color: #8b6b4a;
            font-size: 9px;
            font-weight: 750;
            letter-spacing: .2px;
        }

        .bracket-host .bk-title.pending {
            color: var(--muted);
            font-style: italic;
        }

        .bk-bronze { margin-top: 18px; }

        .results {
            margin-bottom: 14px;
            padding: 12px 14px;
            border: 1px solid #ffd9b0;
            border-radius: 13px;
            background: #fff8f0;
        }

        .results-title {
            margin: 0 0 10px;
            color: #b45f09;
            font-size: 13px;
            font-weight: 750;
        }

        .results-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 8px;
        }

        .place {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 11px;
            border: 1px solid #f0e5d8;
            border-radius: 10px;
            background: #fff;
        }

        .medal {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 28px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #eceae7;
            color: #5f6673;
            font-size: 12.5px;
            font-weight: 750;
        }

        .place-1 .medal { background: #ffd45e; color: #6b4a00; }

        .place-2 .medal { background: #dfe3e8; color: #4b5563; }

        .place-3 .medal { background: #f0c08a; color: #6b3f0d; }

        .place-logo {
            flex: 0 0 26px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #f4f1ee center/cover no-repeat;
        }

        .place-team strong {
            display: block;
            font-size: 13.5px;
            overflow-wrap: anywhere;
        }

        .place-team small {
            color: var(--muted);
            font-size: 11.5px;
        }

        .std-team .person small {
            display: block;
            color: var(--muted);
            font-size: 11.5px;
            font-weight: 500;
        }

        .awards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 9px;
            margin-bottom: 16px;
        }

        .award {
            padding: 11px 13px;
            border: 1px solid #f0e5d8;
            border-radius: 13px;
            background: #fffaf4;
        }

        .award-name {
            margin: 0 0 9px;
            color: #b45f09;
            font-size: 12px;
            font-weight: 750;
        }

        .award-body {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .award-face {
            flex: 0 0 40px;
            width: 40px;
            height: 40px;
            border-radius: 11px;
            background: #f4f1ee center/cover no-repeat;
        }

        .award-face.round { border-radius: 50%; }

        .award-body small {
            display: block;
            color: var(--muted);
            font-size: 11.5px;
        }

        .cat-block + .cat-block {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .cat-title {
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 750;
        }

        .grp-block + .grp-block { margin-top: 18px; }

        .grp-title {
            margin: 0 0 8px;
            color: #b45f09;
            font-size: 13px;
            font-weight: 750;
        }

        .table-wrap { overflow-x: auto; }

        table.standings {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        table.standings th {
            padding: 7px 8px;
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            font-size: 11.5px;
            font-weight: 650;
            text-align: center;
            white-space: nowrap;
        }

        table.standings th:nth-child(2) { text-align: left; }

        table.standings td {
            padding: 8px;
            border-bottom: 1px solid #f4f1ee;
            text-align: center;
            white-space: nowrap;
        }

        table.standings td:nth-child(2) { text-align: left; }

        table.standings tr:last-child td { border-bottom: 0; }

        .std-team {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 650;
        }

        .std-team span.logo {
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: #f4f1ee center/cover no-repeat;
        }

        .fixtures { display: grid; gap: 6px; margin-top: 10px; }

        .fixture {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fbfaf9;
            font-size: 13.5px;
        }

        .fixture .home,
        .fixture .away {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-weight: 650;
        }

        .fixture .home { justify-content: flex-end; text-align: right; }

        .fixture .away { justify-content: flex-start; text-align: left; }

        .fixture .fx-logo {
            flex: 0 0 22px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #f4f1ee center/cover no-repeat;
        }

        .fixture .score {
            min-width: 62px;
            padding: 3px 10px;
            border-radius: 8px;
            background: #fff;
            border: 1px solid var(--line);
            font-weight: 750;
            text-align: center;
        }

        .fixture .score.pending {
            color: var(--muted);
            font-weight: 600;
        }

        .fixture .when {
            grid-column: 1 / -1;
            color: var(--muted);
            font-size: 11.5px;
            text-align: center;
        }

        @media (max-width: 560px) {
            table.standings th:nth-child(4),
            table.standings td:nth-child(4),
            table.standings th:nth-child(5),
            table.standings td:nth-child(5),
            table.standings th:nth-child(6),
            table.standings td:nth-child(6) {
                display: none;
            }
        }

        @media (max-width: 520px) {
            h1 { font-size: 22px; }
            .grid { grid-template-columns: 1fr; }
            .sheet { padding: 0; align-items: flex-end; }

            .sheet-box {
                width: 100%;
                max-height: 92dvh;
                border-radius: 18px 18px 0 0;
            }

            .sheet-poster { height: 180px; }
        }
        .tiebreak-note { margin: 6px 0 0; color: #8a8f99; font-size: 12px; }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="wrap">
            <a class="brand" href="{{ url_for('public_tournaments_page') }}">
                <img src="{{ system_logo_url }}" alt="{{ system_name }}">
            </a>
            <a class="login-link" href="{{ url_for('login') }}">Войти</a>
        </div>
    </div>

    <div class="wrap">
        <h1>Турниры</h1>
        <p class="lead">Расписание соревнований и архив прошедших турниров.</p>

        <div class="tabs" role="tablist">
            <button type="button" class="active" data-tab="upcoming">Предстоящие</button>
            <button type="button" data-tab="past">Завершённые</button>
        </div>

        <div class="grid" id="tournamentGrid">
            <div class="empty-state">Загрузка…</div>
        </div>
    </div>

    <div class="sheet" id="tournamentSheet" hidden>
        <div class="sheet-backdrop" data-close-sheet></div>
        <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <button class="sheet-close" type="button" data-close-sheet aria-label="Закрыть">&times;</button>
            <div id="sheetContent"></div>
        </div>
    </div>

    <script type="module">
        import { createBracket } from "{{ url_for('static', filename='vendor/bracketry/bracketry-1.1.3.esm.js') }}";

        const state = {
            tab: 'upcoming',
            data: { upcoming: [], past: [] },
            sheet: null,
            category: 0,
            sheetTab: 'results',
            bracket: true,
        };
        const byId = (id) => document.getElementById(id);

        function escapeHtml(value) {
            // innerHTML не экранирует кавычки, а значение попадает и в атрибуты.
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDate(value) {
            if (!value) return '';
            return new Intl.DateTimeFormat('ru-RU', {
                day: '2-digit', month: 'long', year: 'numeric',
            }).format(new Date(`${value}T00:00:00`));
        }

        function formatRange(start, end) {
            if (!start) return '';
            if (!end || end === start) return formatDate(start);
            const from = new Date(`${start}T00:00:00`);
            const to = new Date(`${end}T00:00:00`);
            // В пределах одного месяца день начала показываем без месяца: «1–3 сентября 2026».
            if (from.getMonth() === to.getMonth() && from.getFullYear() === to.getFullYear()) {
                return `${from.getDate()}–${formatDate(end)}`;
            }
            return `${formatDate(start)} — ${formatDate(end)}`;
        }

        function shortDate(value) {
            if (!value) return '';
            return new Intl.DateTimeFormat('ru-RU', { day: '2-digit', month: 'short' })
                .format(new Date(`${value}T00:00:00`));
        }

        const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
        const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
        const ICON_TEAMS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>';

        function pluralizeTeams(count) {
            const mod10 = count % 10;
            const mod100 = count % 100;
            if (mod10 === 1 && mod100 !== 11) return `${count} команда`;
            if ([2, 3, 4].includes(mod10) && ![12, 13, 14].includes(mod100)) return `${count} команды`;
            return `${count} команд`;
        }

        const ICON_BALL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10z"/></svg>';

        function cardMarkup(item, finished) {
            const image = item.poster_url || (item.stadium && item.stadium.photo_url) || '';
            const photo = image
                ? `<div class="card-photo" style="background-image:url('${escapeHtml(image)}')">`
                : `<div class="card-photo empty">${ICON_BALL}`;
            const mapLink = item.stadium && item.stadium.latitude
                ? `<a class="map-link" target="_blank" rel="noopener"
                     href="https://www.openstreetmap.org/?mlat=${item.stadium.latitude}&mlon=${item.stadium.longitude}#map=17/${item.stadium.latitude}/${item.stadium.longitude}">Открыть на карте</a>`
                : '';
            const credit = !item.poster_url && item.stadium && item.stadium.photo_source
                ? `<div class="credit">Фото: ${escapeHtml(item.stadium.photo_source)}</div>` : '';
            return `
                <article class="card${finished ? ' finished' : ''}" data-tournament-id="${item.id}"
                    role="button" tabindex="0">
                    ${photo}
                        <span class="card-date">${escapeHtml(shortDate(item.start_date))}</span>
                    </div>
                    <div class="card-body">
                        <h2>${escapeHtml(item.name)}</h2>
                        <div class="meta">
                            <div>${ICON_CLOCK}<span>${escapeHtml(formatRange(item.start_date, item.end_date))}${item.start_time ? `, ${escapeHtml(item.start_time)}` : ''}</span></div>
                            <div>${ICON_PIN}<span>${escapeHtml(item.location || 'Место уточняется')}</span></div>
                            ${item.teams_count
                                ? `<div>${ICON_TEAMS}<span>${escapeHtml(pluralizeTeams(item.teams_count))}</span></div>`
                                : ''}
                        </div>
                        ${item.age_groups.length
                            ? `<div class="ages">${item.age_groups.map((age) => `<span class="age">${escapeHtml(age)}</span>`).join('')}</div>`
                            : ''}
                        ${mapLink}
                        ${credit}
                    </div>
                </article>`;
        }

        function factsMarkup(item) {
            const rows = [
                [ICON_CLOCK, `${formatRange(item.start_date, item.end_date)}${item.start_time ? `, ${item.start_time}` : ''}`],
                [ICON_PIN, item.location || 'Место уточняется'],
            ];
            if (item.teams_count) rows.push([ICON_TEAMS, pluralizeTeams(item.teams_count)]);
            return `<div class="meta">${rows.map(([icon, text]) =>
                `<div>${icon}<span>${escapeHtml(text)}</span></div>`).join('')}</div>`;
        }

        function teamCell(name, logo) {
            const style = logo ? ` style="background-image:url('${escapeHtml(logo)}')"` : '';
            return `<span class="std-team"><span class="logo"${style}></span>${escapeHtml(name)}</span>`;
        }

        function standingsMarkup(rows) {
            return `
                <div class="table-wrap">
                    <table class="standings">
                        <thead>
                            <tr>
                                <th>Место</th><th>Команда</th><th>Игры</th><th>Победы</th>
                                <th>Ничьи</th><th>Поражения</th><th>Мячи</th><th>Очки</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map((row) => `
                                <tr>
                                    <td>${row.place}</td>
                                    <td>${teamCell(row.team_name, row.team_logo_url)}</td>
                                    <td>${row.played}</td>
                                    <td>${row.won}</td>
                                    <td>${row.drawn}</td>
                                    <td>${row.lost}</td>
                                    <td>${row.goals_for}–${row.goals_against}</td>
                                    <td><strong>${row.points}</strong></td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        function fixtureMarkup(match) {
            const when = [
                match.kickoff_at ? formatKickoff(match.kickoff_at) : '',
                match.stadium_name || '',
            ].filter(Boolean).join(' · ');
            const shootout = match.is_played && match.home_score === match.away_score
                && match.home_penalty !== null && match.home_penalty !== undefined;
            const pen = shootout ? ` (пен. ${match.home_penalty}:${match.away_penalty})` : '';
            const score = match.is_played
                ? `${match.home_score} : ${match.away_score}${pen}`
                : '– : –';
            const logo = (url) => `<span class="fx-logo"${url
                ? ` style="background-image:url('${escapeHtml(url)}')"` : ''}></span>`;
            return `
                <div class="fixture">
                    <span class="home">${escapeHtml(match.home)}${logo(match.home_logo_url)}</span>
                    <span class="score${match.is_played ? '' : ' pending'}">${escapeHtml(score)}</span>
                    <span class="away">${logo(match.away_logo_url)}${escapeHtml(match.away)}</span>
                    ${when ? `<span class="when">${escapeHtml(when)}</span>` : ''}
                </div>`;
        }

        function formatKickoff(value) {
            const dt = new Date(value);
            return new Intl.DateTimeFormat('ru-RU', {
                day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit',
            }).format(dt);
        }

        const PLACE_TITLES = { 1: 'Победитель', 2: 'Второе место', 3: 'Третье место', 4: 'Четвёртое место' };

        function resultsMarkup(results) {
            if (!results.length) return '';
            return `
                <div class="results">
                    <p class="results-title">Итоги</p>
                    <div class="results-list">
                        ${results.map((row) => `
                            <div class="place place-${row.place}">
                                <span class="medal">${row.place}</span>
                                <span class="place-logo"${row.team_logo_url
                                    ? ` style="background-image:url('${escapeHtml(row.team_logo_url)}')"` : ''}></span>
                                <span class="place-team">
                                    <strong>${escapeHtml(row.team_name)}</strong>
                                    <small>${escapeHtml(PLACE_TITLES[row.place] || '')}</small>
                                </span>
                            </div>`).join('')}
                    </div>
                </div>`;
        }

        function groupTitle(category, group) {
            // В круговом турнире одна общая таблица — «Группа A» только путает.
            return category.format === 'league' ? 'Таблица' : `Группа ${escapeHtml(group.name)}`;
        }

        function playoffMarkup(matches) {
            // Свободное место в сетке — не матч: команда проходит дальше без игры.
            matches = matches.filter((m) => !m.is_bye);
            if (!matches.length) return '';
            const byLabel = new Map();
            matches.forEach((m) => {
                const key = m.label || 'Плей-офф';
                if (!byLabel.has(key)) byLabel.set(key, []);
                byLabel.get(key).push(m);
            });
            return [...byLabel.entries()].map(([label, items]) => `
                <div class="grp-block">
                    <p class="grp-title">${escapeHtml(label)}</p>
                    <div class="fixtures">${items.map(fixtureMarkup).join('')}</div>
                </div>`).join('');
        }

        function bracketData(allMatches) {
            const bronze = allMatches.find((m) => m.label === 'За 3 место') || null;
            const matches = allMatches.filter((m) => m !== bronze);
            const rounds = [];
            const byRound = new Map();
            matches.forEach((match) => {
                if (!byRound.has(match.round_no)) {
                    byRound.set(match.round_no, []);
                    rounds.push({ no: match.round_no, name: match.label || '' });
                }
                byRound.get(match.round_no).push(match);
            });
            rounds.sort((a, bb) => a.no - bb.no);

            const contestants = {};
            const side = (match, which) => {
                const name = match[which];
                const id = match[`${which}_id`];
                // Плейсхолдеры вроде «Победитель матча 5» уникальны для своего места,
                // иначе библиотека сочла бы их одной и той же командой.
                const key = id ? `t${id}` : `p${match.round_no}-${which}-${name}`;
                if (!contestants[key]) {
                    contestants[key] = {
                        players: [{ title: name, logo: match[`${which}_logo_url`] || null, known: Boolean(id) }],
                    };
                }
                const score = match[`${which}_score`];
                const other = match[which === 'home' ? 'away_score' : 'home_score'];
                // Пенальти пробивают только при ничьей — при другом счёте их не показываем.
                const shootout = score !== null && score === other
                    && match[`${which}_penalty`] !== null && match[`${which}_penalty`] !== undefined;
                const penalty = match[`${which}_penalty`];
                const otherPenalty = match[which === 'home' ? 'away_penalty' : 'home_penalty'];
                const won = match.is_played
                    && (score > other || (shootout && penalty > otherPenalty));
                return {
                    contestantId: key,
                    scores: [{
                        mainScore: score === null ? '–' : String(score) + (shootout ? ` (${penalty})` : ''),
                        isWinner: won,
                    }],
                };
            };

            const built = rounds.flatMap((round, roundIndex) =>
                byRound.get(round.no).map((match, order) => ({
                    roundIndex,
                    order,
                    sides: [side(match, 'home'), side(match, 'away')],
                })));
            // Библиотека сама рисует матч за 3 место, если он идёт вторым в последнем раунде.
            if (bronze) {
                built.push({
                    roundIndex: rounds.length - 1,
                    order: 1,
                    isBronzeMatch: true,
                    sides: [side(bronze, 'home'), side(bronze, 'away')],
                });
            }

            return { rounds: rounds.map((round) => ({ name: round.name })), matches: built, contestants };
        }

        function drawBracket(matches) {
            const host = byId('bracketHost');
            if (!host) return;
            const main = matches.filter((m) => m.label !== 'За 3 место');
            if (!main.length) return;
            // Библиотека тянется на высоту контейнера, поэтому считаем её по первому раунду.
            const firstRound = Math.min(...main.map((m) => m.round_no));
            const rows = main.filter((m) => m.round_no === firstRound).length;
            host.style.height = `${Math.max(300, rows * 92 + 96)}px`;
            createBracket(bracketData(matches), host, {
                rootBgColor: 'transparent',
                rootBorderColor: 'transparent',
                matchTextColor: '#17191f',
                connectionLinesColor: '#ddd4ca',
                highlightedConnectionLinesColor: '#ff8a00',
                roundTitleColor: '#b45f09',
                roundTitlesFontSize: 12,
                roundTitlesBorderColor: '#efe9e3',
                hoveredMatchBorderColor: '#ffd9b0',
                highlightedPlayerTitleColor: '#b45f09',
                matchFontSize: 13,
                matchMaxWidth: 190,
                matchHorMargin: 12,
                matchMinVerticalGap: 14,
                useClassicalLayout: true,
                verticalScrollMode: 'native',
                scrollbarWidth: 6,
                scrollbarColor: 'rgba(23, 25, 31, .16)',
                navButtonsPosition: 'gutters',
                navButtonSvgColor: '#c98a3a',
                navButtonArrowSize: 11,
                navGutterBorderColor: 'transparent',
                displayWholeRounds: true,
                width: '100%',
                getNationalityHTML: (player) => {
                    if (!player.known) return '';
                    if (player.logo) {
                        return `<span class="bk-logo"><img src="${escapeHtml(player.logo)}" alt=""></span>`;
                    }
                    const initials = (player.title || '?').trim().slice(0, 2).toUpperCase();
                    return `<span class="bk-logo empty">${escapeHtml(initials)}</span>`;
                },
                getPlayerTitleHTML: (player) => `<span class="bk-title${player.known ? '' : ' pending'}">`
                    + `${escapeHtml(player.title)}</span>`,
                getMatchTopHTML: (match) => (match && match.isBronzeMatch
                    ? '<span class="bronze-title">За 3 место</span>' : ''),
            });
        }

        function statTable(title, headers, rows) {
            if (!rows.length) return '';
            return `
                <div class="grp-block">
                    <p class="grp-title">${escapeHtml(title)}</p>
                    <div class="table-wrap">
                        <table class="standings">
                            <thead><tr>${headers.map((h) => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
                            <tbody>${rows.join('')}</tbody>
                        </table>
                    </div>
                </div>`;
        }

        function personCell(row) {
            return `<span class="std-team">
                <span class="logo"${row.photo_url
                    ? ` style="background-image:url('${escapeHtml(row.photo_url)}')"` : ''}></span>
                <span class="person">
                    <strong>${escapeHtml(row.name)}</strong>
                    <small>${escapeHtml(row.team_name)}</small>
                </span>
            </span>`;
        }

        function awardFace(winner) {
            return winner.member_id ? winner.photo_url : winner.team_logo_url;
        }

        function awardsMarkup(awards) {
            if (!awards.length) return '';
            return `
                <div class="awards">
                    ${awards.map((award) => `
                        <div class="award">
                            <p class="award-name">${escapeHtml(award.title)}</p>
                            <div class="award-body">
                                <span class="award-face${award.winner.member_id ? '' : ' round'}"${
                                    awardFace(award.winner)
                                        ? ` style="background-image:url('${escapeHtml(
                                            awardFace(award.winner))}')"` : ''}></span>
                                <span>
                                    <strong>${escapeHtml(award.winner.name)}</strong>
                                    <small>${escapeHtml(award.winner.team_name)}</small>
                                </span>
                            </div>
                        </div>`).join('')}
                </div>`;
        }

        function playersPane(category) {
            const players = category.players || {};
            const parts = [
                awardsMarkup(players.awards || []),
                statTable('Бомбардиры', ['#', 'Игрок', 'Голы', 'Ассисты', 'Матчи'],
                    (players.scorers || []).map((row, index) => `
                        <tr><td>${index + 1}</td><td>${personCell(row)}</td>
                            <td><strong>${row.goals}</strong></td><td>${row.assists}</td>
                            <td>${row.matches}</td></tr>`)),
                statTable('Вратари', ['#', 'Вратарь', 'Матчи', 'Пропущено', 'Сухие матчи'],
                    (players.goalkeepers || []).map((row, index) => `
                        <tr><td>${index + 1}</td><td>${personCell(row)}</td>
                            <td>${row.matches}</td><td>${row.conceded}</td>
                            <td><strong>${row.clean_sheets}</strong></td></tr>`)),
                statTable('Fair Play', ['#', 'Команда', 'Матчи', 'Штрафные очки'],
                    (players.fair_play || []).map((row, index) => `
                        <tr><td>${index + 1}</td>
                            <td><span class="std-team"><span class="logo"${row.team_logo_url
                                ? ` style="background-image:url('${escapeHtml(row.team_logo_url)}')"` : ''}></span>
                                ${escapeHtml(row.team_name)}</span></td>
                            <td>${row.matches}</td><td><strong>${row.penalty}</strong></td></tr>`)),
            ].filter(Boolean);
            return parts.length ? parts.join('')
                : '<p class="lead" style="margin:0">Протоколы матчей ещё не заполнены.</p>';
        }

        function playoffPane(category) {
            const matches = category.playoff || [];
            if (!matches.length) {
                return '<p class="lead" style="margin:0">Плей-офф ещё не сформирован.</p>';
            }
            return `
                <div class="view-switch">
                    <button type="button" class="${state.bracket ? 'active' : ''}" data-view="bracket">Сетка</button>
                    <button type="button" class="${state.bracket ? '' : 'active'}" data-view="list">Список</button>
                </div>
                ${state.bracket
                    ? '<div id="bracketHost" class="bracket-host"></div>'
                    : playoffMarkup(matches)}`;
        }

        function tablesPane(category) {
            if (!category.groups.length) {
                return `<div class="sheet-team-list">
                    ${category.teams.map((team) => `
                        <div class="sheet-team">
                            <span class="logo">${team.logo_url
                                ? `<img src="${escapeHtml(team.logo_url)}" alt="">`
                                : escapeHtml((team.name || '?').slice(0, 2).toUpperCase())}</span>
                            <span>${escapeHtml(team.name)}</span>
                        </div>`).join('')}
                </div>`;
            }
            return category.groups.map((group) => `
                <div class="grp-block">
                    <p class="grp-title">${groupTitle(category, group)}</p>
                    ${group.standings.length ? standingsMarkup(group.standings) + (category.tiebreak_title ? `<p class="tiebreak-note">При равенстве очков: ${escapeHtml(category.tiebreak_title)}</p>` : '') : ''}
                    ${group.matches.length
                        ? `<div class="fixtures">${group.matches.map(fixtureMarkup).join('')}</div>`
                        : ''}
                </div>`).join('');
        }

        function sheetBodyMarkup() {
            const item = state.sheet;
            const categories = item.categories || [];
            if (!categories.length) {
                return '<p class="lead" style="margin:0">Список участников ещё формируется.</p>';
            }
            const category = categories[Math.min(state.category, categories.length - 1)];
            const panes = {
                results: (category.results || []).length
                    ? resultsMarkup(category.results)
                    : '<p class="lead" style="margin:0">Итоги появятся после финала.</p>',
                tables: tablesPane(category),
                playoff: playoffPane(category),
                players: playersPane(category),
            };
            const tabs = [
                ['results', 'Итоги'],
                ['tables', category.format === 'knockout' ? 'Участники' : 'Таблицы'],
                ['playoff', 'Плей-офф'],
                ['players', 'Игроки'],
            ].filter(([key]) => key !== 'playoff' || (category.playoff || []).length);
            if (!tabs.some(([key]) => key === state.sheetTab)) state.sheetTab = tabs[0][0];
            return `
                ${categories.length > 1 ? `
                    <div class="cat-switch">
                        ${categories.map((c, index) => `
                            <button type="button" class="${index === state.category ? 'active' : ''}"
                                data-category="${index}">${escapeHtml(c.age_group)}</button>`).join('')}
                    </div>` : ''}
                <div class="sheet-tabs">
                    ${tabs.map(([key, title]) => `
                        <button type="button" class="${state.sheetTab === key ? 'active' : ''}"
                            data-sheet-tab="${key}">${title}</button>`).join('')}
                </div>
                <div class="sheet-pane">${panes[state.sheetTab]}</div>`;
        }

        function renderSheetBody() {
            const box = byId('sheetBody');
            if (!box) return;
            box.innerHTML = sheetBodyMarkup();
            if (state.sheetTab === 'playoff' && state.bracket) {
                const item = state.sheet;
                const categories = item.categories || [];
                const category = categories[Math.min(state.category, categories.length - 1)];
                if (category) drawBracket(category.playoff || []);
            }
        }

        function categoriesMarkup(categories) {
            if (!categories.length) {
                return '<h3>Участники</h3><p class="lead" style="margin:0">Список участников ещё формируется.</p>';
            }
            return categories.map((category) => {
                // Пока группы не сформированы, показываем простой список команд.
                const body = category.groups.length
                    ? category.groups.map((group) => `
                        <div class="grp-block">
                            <p class="grp-title">${groupTitle(category, group)}</p>
                            ${group.standings.length ? standingsMarkup(group.standings) + (category.tiebreak_title ? `<p class="tiebreak-note">При равенстве очков: ${escapeHtml(category.tiebreak_title)}</p>` : '') : ''}
                            ${group.matches.length
                                ? `<div class="fixtures">${group.matches.map(fixtureMarkup).join('')}</div>`
                                : ''}
                        </div>`).join('')
                    : `<div class="sheet-team-list">
                            ${category.teams.map((team) => `
                                <div class="sheet-team">
                                    <span class="logo">${team.logo_url
                                        ? `<img src="${escapeHtml(team.logo_url)}" alt="">`
                                        : escapeHtml((team.name || '?').slice(0, 2).toUpperCase())}</span>
                                    <span>${escapeHtml(team.name)}</span>
                                </div>`).join('')}
                        </div>`;
                return `
                    <div class="cat-block">
                        <h3 class="cat-title">${escapeHtml(category.age_group)}</h3>
                        ${resultsMarkup(category.results || [])}
                        ${body}
                        ${playoffMarkup(category.playoff || [])}
                    </div>`;
            }).join('');
        }

        function openSheet(id) {
            const sheet = byId('tournamentSheet');
            byId('sheetContent').innerHTML = '<div class="sheet-body"><p>Загрузка…</p></div>';
            sheet.hidden = false;
            document.body.style.overflow = 'hidden';

            fetch(`/api/public/tournaments/${id}`, { credentials: 'same-origin' })
                .then((response) => response.json())
                .then((data) => {
                    if (!data.success) throw new Error(data.message || 'Турнир не найден');
                    const item = data.tournament;
                    const image = item.poster_url || (item.stadium && item.stadium.photo_url) || '';
                    const mapLink = item.stadium && item.stadium.latitude
                        ? `<a class="map-link" target="_blank" rel="noopener"
                             href="https://www.openstreetmap.org/?mlat=${item.stadium.latitude}&mlon=${item.stadium.longitude}#map=17/${item.stadium.latitude}/${item.stadium.longitude}">Открыть на карте</a>`
                        : '';
                    state.sheet = item;
                    state.category = 0;
                    state.sheetTab = (item.categories || []).some((c) => (c.results || []).length)
                        ? 'results' : 'tables';

                    byId('sheetContent').innerHTML = `
                        ${image
                            ? `<div class="sheet-poster" style="background-image:url('${escapeHtml(image)}')"></div>`
                            : `<div class="sheet-poster empty">${ICON_BALL}</div>`}
                        <div class="sheet-body">
                            <h2 id="sheetTitle">${escapeHtml(item.name)}</h2>
                            ${factsMarkup(item)}
                            ${item.age_groups.length
                                ? `<div class="ages">${item.age_groups.map((age) =>
                                    `<span class="age">${escapeHtml(age)}</span>`).join('')}</div>`
                                : ''}
                            ${mapLink}
                            <div class="sheet-teams" id="sheetBody"></div>
                            ${!item.poster_url && item.stadium && item.stadium.photo_source
                                ? `<div class="credit">Фото: ${escapeHtml(item.stadium.photo_source)}</div>` : ''}
                        </div>`;
                    renderSheetBody();
                })
                .catch((error) => {
                    byId('sheetContent').innerHTML =
                        `<div class="sheet-body"><p>${escapeHtml(error.message)}</p></div>`;
                });
        }

        function closeSheet() {
            byId('tournamentSheet').hidden = true;
            document.body.style.overflow = '';
        }

        document.addEventListener('click', (event) => {
            if (event.target.closest('[data-close-sheet]')) {
                closeSheet();
                return;
            }
            const tab = event.target.closest('[data-sheet-tab]');
            if (tab) {
                state.sheetTab = tab.dataset.sheetTab;
                renderSheetBody();
                return;
            }
            const category = event.target.closest('[data-category]');
            if (category) {
                state.category = Number(category.dataset.category);
                renderSheetBody();
                return;
            }
            const view = event.target.closest('[data-view]');
            if (view) {
                state.bracket = view.dataset.view === 'bracket';
                renderSheetBody();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !byId('tournamentSheet').hidden) closeSheet();
        });

        byId('tournamentGrid').addEventListener('click', (event) => {
            const card = event.target.closest('[data-tournament-id]');
            if (card) openSheet(card.dataset.tournamentId);
        });

        function render() {
            const items = state.data[state.tab] || [];
            const grid = byId('tournamentGrid');
            if (!items.length) {
                grid.innerHTML = `<div class="empty-state">${state.tab === 'upcoming'
                    ? 'Предстоящих турниров пока нет. Загляните позже.'
                    : 'Завершённых турниров пока нет.'}</div>`;
                return;
            }
            grid.innerHTML = items.map((item) => cardMarkup(item, state.tab === 'past')).join('');
        }

        document.querySelectorAll('.tabs button').forEach((button) => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.tabs button').forEach((item) => item.classList.remove('active'));
                button.classList.add('active');
                state.tab = button.dataset.tab;
                render();
            });
        });

        fetch('/api/public/tournaments', { credentials: 'same-origin' })
            .then((response) => response.json())
            .then((data) => {
                state.data = { upcoming: data.upcoming || [], past: data.past || [] };
                render();
            })
            .catch(() => {
                byId('tournamentGrid').innerHTML =
                    '<div class="empty-state">Не удалось загрузить афишу. Обновите страницу.</div>';
            });
    </script>
</body>

</html>
