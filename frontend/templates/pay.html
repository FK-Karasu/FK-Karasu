<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Оплата - {{ system_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon.png') }}">
    {% include '_pwa_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2026111001">
    <style>
        body {
            margin: 0;
            background: #fff;
            color: #0f172a;
            font-family: var(--ui-font-family);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .pay-bg-video {
            position: fixed;
            right: 18px;
            bottom: 0;
            width: min(32vw, 360px);
            min-width: 240px;
            height: min(78vh, 720px);
            object-fit: contain;
            object-position: center bottom;
            opacity: .13;
            pointer-events: none;
            z-index: 0;
            filter: saturate(.9);
        }
        .pay-shell {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 18px 44px;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .pay-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }
        .pay-header .btn-secondary {
            justify-self: end;
        }
        .pay-header-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }
        .pay-header-logo img {
            width: 120px;
            max-height: 54px;
            object-fit: contain;
        }
        .pay-lang {
            position: relative;
        }
        .pay-lang-toggle,
        .pay-lang-menu button {
            min-width: 72px;
            height: 36px;
            border: 1px solid #e4ddd6;
            border-radius: 9px;
            background: #fff;
            color: #64748b;
            font: 600 12px/1 var(--ui-font-family);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 10px;
        }
        .pay-lang-toggle::after {
            content: "";
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #94a3b8;
            margin-left: 2px;
        }
        .pay-lang-menu {
            position: absolute;
            left: 0;
            top: calc(100% + 6px);
            display: none;
            min-width: 92px;
            padding: 5px;
            border: 1px solid #e4ddd6;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 14px 30px rgba(15, 23, 42, .12);
            z-index: 30;
        }
        .pay-lang.open .pay-lang-menu {
            display: grid;
            gap: 3px;
        }
        .pay-lang-menu button {
            width: 100%;
            justify-content: flex-start;
            border: 0;
            background: transparent;
        }
        .pay-lang-menu button.active {
            background: #fff7ed;
            color: #d96f00;
        }
        .pay-flag {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex: 0 0 auto;
        }
        .pay-grid {
            display: block;
        }
        .pay-panel {
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #fff;
            padding: 22px 20px 28px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, .045);
        }
        .pay-card-title {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
            color: #334155;
            font: 700 17px/1.2 var(--ui-font-family);
            text-align: center;
        }
        .pay-form {
            display: grid;
            gap: 15px;
        }
        .pay-form label {
            display: grid;
            gap: 7px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }
        .pay-form input[type="text"] {
            min-height: 42px;
            border: 1px solid #d8d0c8;
            border-radius: 8px;
            padding: 0 12px;
            background: #fff;
            color: #0f172a;
            font-size: 14px;
        }
        .pay-mode {
            display: grid;
            grid-template-columns: repeat(2, 78px);
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .pay-mode label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            aspect-ratio: 1 / 1;
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #f7f4f1;
            color: #475569;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.15;
            text-align: center;
            cursor: pointer;
            padding: 7px;
            transition: border-color .18s ease, background-color .18s ease, color .18s ease;
        }
        .pay-mode label span {
            display: block;
            width: 100%;
            text-align: center;
        }
        .pay-mode input { display: none; }
        .pay-mode-icon {
            width: 18px;
            height: 18px;
            color: #334155;
        }
        .pay-mode label:has(input:checked) {
            border-color: #ff8a00;
            background: #fff7ed;
            color: #d96f00;
        }
        .pay-mode label:has(input:checked) .pay-mode-icon {
            color: #d96f00;
        }
        .pay-group-section {
            display: grid;
            gap: 10px;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            width: 100%;
            max-width: 422px;
            margin: 0 auto;
        }
        .pay-group-cards {
            display: grid;
            grid-template-columns: repeat(5, 78px);
            justify-content: start;
            gap: 8px;
            width: 100%;
        }
        .pay-group-card {
            position: relative;
            min-height: 78px;
            aspect-ratio: 1 / 1;
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #f7f4f1;
            color: #334155;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 7px;
            text-align: center;
            font: 600 10px/1.08 var(--ui-font-family);
            transition: border-color .18s ease, background-color .18s ease, color .18s ease, box-shadow .18s ease, opacity .18s ease;
        }
        .pay-group-cards:has(.pay-group-card.active) .pay-group-card:not(.active) {
            opacity: .48;
        }
        .pay-group-card:hover {
            border-color: #ffc178;
            background: #fffaf4;
            opacity: 1 !important;
        }
        .pay-group-card.active {
            border-color: #ff8a00;
            background: #fff7ed;
            color: #d96f00;
            box-shadow: 0 8px 18px rgba(255, 138, 0, .12);
        }
        .pay-group-card.active .pay-group-icon,
        .pay-group-card.active .pay-group-check {
            color: #d96f00;
        }
        .pay-group-icon {
            width: 18px;
            height: 18px;
            color: #334155;
        }
        .pay-group-check {
            position: absolute;
            top: 6px;
            right: 6px;
            display: none;
            width: 14px;
            height: 14px;
            color: #d96f00;
        }
        .pay-group-card.active .pay-group-check {
            display: block;
        }
        .pay-group-name {
            display: grid;
            gap: 1px;
            max-width: 100%;
        }
        .pay-group-title,
        .pay-group-subtitle {
            display: block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pay-group-subtitle {
            font-size: 9px;
            line-height: 1.05;
        }
        .pay-period {
            display: grid;
            gap: 7px;
        }
        .pay-period select {
            min-height: 42px;
            border: 1px solid #d8d0c8;
            border-radius: 8px;
            padding: 0 12px;
            background: #fff;
            color: #0f172a;
            font: 500 14px/1 var(--ui-font-family);
        }
        .pay-combobox {
            position: relative;
        }
        .pay-combobox input {
            width: 100%;
        }
        .pay-combobox::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 50%;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #64748b;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .pay-dropdown {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 5px);
            z-index: 20;
            display: none;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 16px 34px rgba(15, 23, 42, .12);
            padding: 5px;
        }
        .pay-dropdown.open {
            display: grid;
            gap: 2px;
        }
        .pay-option {
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #1f2937;
            padding: 9px 10px;
            text-align: left;
            font: 500 13px/1.25 var(--ui-font-family);
            cursor: pointer;
        }
        .pay-option:hover,
        .pay-option:focus-visible {
            background: #f7f4f1;
            outline: none;
        }
        .pay-empty {
            padding: 10px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }
        .pay-student-picks {
            display: grid;
            gap: 8px;
        }
        .pay-student-pick {
            display: flex !important;
            grid-template-columns: none !important;
            align-items: center;
            justify-content: space-between;
            gap: 12px !important;
            min-height: 48px;
            padding: 10px 12px;
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
        }
        .pay-student-pick input {
            width: 16px;
            height: 16px;
            accent-color: #ff8a00;
            flex: 0 0 auto;
        }
        .pay-student-pick-main {
            display: grid;
            gap: 3px;
            min-width: 0;
            margin-right: auto;
        }
        .pay-student-pick-name {
            color: #111827;
            font-size: 13px;
            font-weight: 700;
        }
        .pay-student-pick-meta {
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
        }
        .pay-student-pick-amount {
            color: #111827;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }
        .pay-summary {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 4px;
            padding: 14px;
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #f8f7f6;
        }
        .pay-summary-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: #475569;
            font-size: 13px;
        }
        .pay-summary-row strong {
            color: #0f172a;
            text-align: right;
            font-size: 14px;
        }
        .pay-methods {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .pay-method {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            min-height: 44px;
            padding: 0 12px;
            border: 1px solid #d8d0c8;
            border-radius: 8px;
            background: #fff;
            color: #334155;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }
        .pay-form .pay-method {
            display: flex;
            grid-template-columns: none;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }
        .pay-method input { display: none; }
        .pay-method-logo {
            width: 38px;
            height: 24px;
            object-fit: contain;
            flex: 0 0 auto;
            filter: grayscale(1);
            opacity: .72;
            transition: filter .18s ease, opacity .18s ease;
        }
        .pay-method-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pay-method:has(input:checked) {
            border-color: #ff8a00;
            background: #fff6eb;
            color: #d96f00;
        }
        .pay-method:has(input:checked) .pay-method-logo {
            filter: grayscale(0);
            opacity: 1;
        }
        .pay-method.disabled {
            opacity: .45;
            cursor: not-allowed;
        }
        .pay-consent {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #475569;
            font-size: 13px;
            line-height: 1.45;
        }
        .pay-form .pay-consent {
            display: flex;
            grid-template-columns: none;
            flex-direction: row;
        }
        .pay-consent input {
            margin: 0;
            flex: 0 0 auto;
        }
        .pay-consent input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid #111827;
            border-radius: 3px;
            background: #fff;
            display: inline-grid;
            place-content: center;
            cursor: pointer;
        }
        .pay-consent input[type="checkbox"]::before {
            content: "";
            width: 8px;
            height: 8px;
            transform: scale(0);
            background: #fff;
            clip-path: polygon(14% 44%, 0 58%, 38% 96%, 100% 20%, 86% 6%, 36% 68%);
        }
        .pay-consent input[type="checkbox"]:checked {
            border-color: #ff8a00;
            background: #ff8a00;
        }
        .pay-consent input[type="checkbox"]:checked::before {
            transform: scale(1);
        }
        #pay-submit {
            min-height: 42px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
        }
        #pay-submit:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .pay-consent a {
            color: #d96f00;
            font-weight: 700;
            text-decoration: none;
        }
        .pay-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 16px;
            margin-top: auto;
            padding-top: 28px;
            font-size: 12px;
            font-family: var(--ui-font-family);
        }
        .pay-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            font-weight: 600;
            text-decoration: none;
        }
        .pay-links a:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .pay-link-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #eef1f5;
            color: #64748b;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
        }
        .pay-note {
            margin-top: 12px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.45;
        }
        .pay-result {
            min-height: 20px;
            margin-top: 12px;
            color: #059669;
            font-size: 14px;
            font-weight: 700;
        }
        .pay-result.error { color: #dc2626; }
        .pay-provider-box {
            display: none;
            margin-top: 12px;
            padding: 14px;
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #fff;
        }
        .pay-provider-box img {
            display: block;
            max-width: 180px;
            max-height: 180px;
            margin-top: 10px;
            border-radius: 8px;
        }
        .pay-step-hidden {
            display: none !important;
        }
        @media (max-width: 860px) {
            .pay-methods { grid-template-columns: 1fr; }
            .pay-header {
                grid-template-columns: auto 1fr auto;
                gap: 10px;
            }
            .pay-header-logo img {
                width: 100px;
            }
            .pay-header .btn-secondary {
                min-width: 0;
                width: auto;
                padding-inline: 12px;
                justify-content: center;
            }
            .pay-mode {
                grid-template-columns: repeat(2, 78px);
            }
            .pay-group-cards {
                grid-template-columns: repeat(3, 78px);
                justify-content: center;
            }
            .pay-group-section {
                max-width: 250px;
            }
            .pay-bg-video {
                right: -8px;
                bottom: 0;
                width: 62vw;
                min-width: 220px;
                height: 72vh;
                opacity: .11;
            }
        }
    </style>
</head>

<body>
    <video class="pay-bg-video" autoplay muted loop playsinline aria-hidden="true">
        <source src="{{ url_for('static', filename='uploads/sidebar_soccer_bg.mp4') }}" type="video/mp4">
    </video>
    <main class="pay-shell">
        <header class="pay-header">
            <div class="pay-lang" aria-label="Язык">
                <button type="button" class="pay-lang-toggle" id="pay-lang-toggle" aria-haspopup="true" aria-expanded="false"></button>
                <div class="pay-lang-menu" id="pay-lang-menu">
                    <button type="button" data-pay-lang="ru" class="active">
                        <svg class="pay-flag" viewBox="0 0 18 18" aria-hidden="true"><clipPath id="pay-flag-ru"><circle cx="9" cy="9" r="9"/></clipPath><g clip-path="url(#pay-flag-ru)"><path fill="#fff" d="M0 0h18v6H0z"/><path fill="#1c57a7" d="M0 6h18v6H0z"/><path fill="#d52b1e" d="M0 12h18v6H0z"/></g></svg>
                        RU
                    </button>
                    <button type="button" data-pay-lang="uz">
                        <svg class="pay-flag" viewBox="0 0 18 18" aria-hidden="true"><clipPath id="pay-flag-uz"><circle cx="9" cy="9" r="9"/></clipPath><g clip-path="url(#pay-flag-uz)"><path fill="#1eb6d9" d="M0 0h18v5.2H0z"/><path fill="#fff" d="M0 6.4h18v5.2H0z"/><path fill="#1f9d55" d="M0 12.8h18V18H0z"/><path fill="#d91f26" d="M0 5.2h18v1.2H0zM0 11.6h18v1.2H0z"/><circle cx="4" cy="2.6" r="1.25" fill="#fff"/></g></svg>
                        UZ
                    </button>
                </div>
            </div>
            <div class="pay-header-logo">
                <img src="{{ system_logo_url }}" alt="{{ system_name }}">
            </div>
            <a class="btn-secondary" href="{{ url_for('login') }}" data-i18n="login">Войти в систему</a>
        </header>

        <div class="pay-grid">
            <section class="pay-panel">
                <div class="pay-card-title" data-i18n="payTitle">Оплата обучения</div>
                <form class="pay-form" id="pay-form">
                    <div class="pay-mode" aria-label="Способ поиска ученика">
                        <label>
                            <input type="radio" name="pay_lookup_mode" value="group">
                            <i data-lucide="users" class="pay-mode-icon" aria-hidden="true"></i>
                            <span data-i18n="byGroup">По группе</span>
                        </label>
                        <label>
                            <input type="radio" name="pay_lookup_mode" value="phone" checked>
                            <i data-lucide="phone" class="pay-mode-icon" aria-hidden="true"></i>
                            <span data-i18n="byPhone">По телефону</span>
                        </label>
                    </div>

                    <label id="pay-phone-step" class="pay-step-hidden">
                        <span data-i18n="phone">Телефон</span>
                        <input id="pay-phone" type="text" inputmode="tel" autocomplete="off" value="+998 " placeholder="+998 XX XXX XX XX">
                    </label>
                    <div class="pay-student-picks pay-step-hidden" id="pay-phone-results"></div>

                    <section id="pay-group-step" class="pay-group-section">
                        <span data-i18n="group">Выберите группу</span>
                        <div class="pay-group-cards" id="pay-group-cards"></div>
                    </section>
                    <label id="pay-student-step" class="pay-step-hidden">
                        <span data-i18n="student">Ученик</span>
                        <div class="pay-combobox">
                            <input id="pay-student" type="text" autocomplete="off" placeholder="Сначала выберите группу" disabled>
                            <div class="pay-dropdown" id="pay-student-list"></div>
                        </div>
                    </label>

                    <label class="pay-period pay-step-hidden" id="pay-period-step">
                        <span data-i18n="payMonth">Месяц оплаты</span>
                        <select id="pay-period"></select>
                    </label>

                    <div class="pay-summary" id="pay-summary" style="display:none;"></div>

                    <label id="pay-method-step" class="pay-step-hidden">
                        <span data-i18n="payMethod">Способ оплаты</span>
                        <div class="pay-methods" id="pay-methods"></div>
                    </label>

                    <label class="pay-consent pay-step-hidden" id="pay-consent-step">
                        <input type="checkbox" id="pay-consent" required>
                        <span>
                            <span data-i18n="acceptPrefix">Я принимаю</span>
                            <a class="pay-legal-link" data-section="offer" href="{{ url_for('legal_page', section='offer', lang='ru') }}" target="_blank" data-i18n="termsLink">пользовательское соглашение</a>,
                            <a class="pay-legal-link" data-section="privacy" href="{{ url_for('legal_page', section='privacy', lang='ru') }}" target="_blank" data-i18n="privacyLink">политику конфиденциальности</a>
                            <span data-i18n="acceptAnd">и</span>
                            <a class="pay-legal-link" data-section="refund" href="{{ url_for('legal_page', section='refund', lang='ru') }}" target="_blank" data-i18n="refundLink">правила оплаты и возврата</a>.
                        </span>
                    </label>

                    <button class="btn-primary pay-step-hidden" id="pay-submit" type="submit" disabled data-i18n="submit">Перейти к оформлению</button>
                    <div class="pay-result" id="pay-result"></div>
                    <div class="pay-provider-box" id="pay-provider-box"></div>

                </form>
            </section>
        </div>
        <div class="pay-links">
            <a class="pay-legal-link" data-section="privacy" href="{{ url_for('legal_page', section='privacy', lang='ru') }}" target="_blank"><i data-lucide="info" class="pay-link-icon" aria-hidden="true"></i><span data-i18n="privacyDoc">Политика конфиденциальности</span></a>
            <a class="pay-legal-link" data-section="offer" href="{{ url_for('legal_page', section='offer', lang='ru') }}" target="_blank"><i data-lucide="check" class="pay-link-icon" aria-hidden="true"></i><span data-i18n="termsDoc">Пользовательское соглашение</span></a>
            <a class="pay-legal-link" data-section="refund" href="{{ url_for('legal_page', section='refund', lang='ru') }}" target="_blank"><i data-lucide="receipt" class="pay-link-icon" aria-hidden="true"></i><span data-i18n="refundDoc">Правила оплаты и возврата</span></a>
        </div>
    </main>

    <script src="{{ url_for('static', filename='vendor/lucide-1.24.0.min.js') }}"></script>
    <script>
        const state = { groups: [], methods: [], students: [], phoneStudents: [], selectedGroup: null, selectedStudent: null, selectedStudents: [], selectedPeriod: null, mode: 'phone', lang: 'ru' };
        const periodStep = document.getElementById('pay-period-step');
        const periodSelect = document.getElementById('pay-period');
        const groupStep = document.getElementById('pay-group-step');
        const groupCards = document.getElementById('pay-group-cards');
        const studentInput = document.getElementById('pay-student');
        const studentList = document.getElementById('pay-student-list');
        const phoneStep = document.getElementById('pay-phone-step');
        const phoneInput = document.getElementById('pay-phone');
        const phoneResults = document.getElementById('pay-phone-results');
        const methodsBox = document.getElementById('pay-methods');
        const summaryBox = document.getElementById('pay-summary');
        const submitBtn = document.getElementById('pay-submit');
        const resultBox = document.getElementById('pay-result');
        const providerBox = document.getElementById('pay-provider-box');
        const studentStep = document.getElementById('pay-student-step');
        const methodStep = document.getElementById('pay-method-step');
        const consentStep = document.getElementById('pay-consent-step');
        const consentInput = document.getElementById('pay-consent');

        const i18n = {
            ru: {
                login: 'Войти в систему',
                payTitle: 'Оплата обучения',
                byGroup: 'По группе',
                byPhone: 'По телефону',
                phone: 'Телефон',
                group: 'Выберите группу',
                student: 'Ученик',
                payMonth: 'Месяц оплаты',
                payMethod: 'Способ оплаты',
                acceptPrefix: 'Я принимаю',
                termsLink: 'пользовательское соглашение',
                privacyLink: 'политику конфиденциальности',
                acceptAnd: 'и',
                refundLink: 'правила оплаты и возврата',
                submit: 'Перейти к оформлению',
                privacyDoc: 'Политика конфиденциальности',
                termsDoc: 'Пользовательское соглашение',
                refundDoc: 'Правила оплаты и возврата',
                groupPlaceholder: 'Введите название группы',
                studentBeforeGroup: 'Сначала выберите группу',
                studentLoading: 'Загрузка...',
                studentPlaceholder: 'Введите ФИО ученика',
                nothingFound: 'Ничего не найдено',
                noStudentsPhone: 'По этому номеру ученики не найдены',
                searching: 'Ищем учеников...',
                noUnpaid: 'Нет неоплаченных месяцев',
                chooseMonth: 'Выберите месяц оплаты',
                month: 'Месяц',
                tariff: 'Тариф',
                amountDue: 'К оплате',
                noGroup: 'Без группы',
                paid: 'Оплачено',
                monthsShort: 'мес.',
                soon: ' скоро',
                checkoutFailed: 'Не удалось подготовить оплату',
                providerNote: 'После подключения API здесь будет переход на защищенную страницу платежной системы.',
                months: ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь']
            },
            uz: {
                login: 'Tizimga kirish',
                payTitle: 'Ta’lim uchun to‘lov',
                byGroup: 'Guruh bo‘yicha',
                byPhone: 'Telefon bo‘yicha',
                phone: 'Telefon',
                group: 'Guruhni tanlang',
                student: 'O‘quvchi',
                payMonth: 'To‘lov oyi',
                payMethod: 'To‘lov usuli',
                acceptPrefix: 'Men',
                termsLink: 'foydalanuvchi kelishuvi',
                privacyLink: 'maxfiylik siyosati',
                acceptAnd: 'va',
                refundLink: 'to‘lov va qaytarish qoidalarini qabul qilaman',
                submit: 'Rasmiylashtirishga o‘tish',
                privacyDoc: 'Maxfiylik siyosati',
                termsDoc: 'Foydalanuvchi kelishuvi',
                refundDoc: 'To‘lov va qaytarish qoidalari',
                groupPlaceholder: 'Guruh nomini kiriting',
                studentBeforeGroup: 'Avval guruhni tanlang',
                studentLoading: 'Yuklanmoqda...',
                studentPlaceholder: 'O‘quvchi F.I.Sh. ni kiriting',
                nothingFound: 'Hech narsa topilmadi',
                noStudentsPhone: 'Bu raqam bo‘yicha o‘quvchi topilmadi',
                searching: 'O‘quvchilar qidirilmoqda...',
                noUnpaid: 'To‘lanmagan oylar yo‘q',
                chooseMonth: 'To‘lov oyini tanlang',
                month: 'Oy',
                tariff: 'Tarif',
                amountDue: 'To‘lov summasi',
                noGroup: 'Guruhsiz',
                paid: 'To‘langan',
                monthsShort: 'oy',
                soon: ' tez orada',
                checkoutFailed: 'To‘lovni tayyorlab bo‘lmadi',
                providerNote: 'API ulangandan keyin bu yerda to‘lov tizimining himoyalangan sahifasiga o‘tish bo‘ladi.',
                months: ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentabr', 'Oktabr', 'Noyabr', 'Dekabr']
            }
        };
        const t = key => (i18n[state.lang] && i18n[state.lang][key]) || i18n.ru[key] || key;
        const monthNames = () => t('months');
        const money = value => `${Number(value || 0).toLocaleString('ru-RU')} сум`;
        const refreshIcons = () => {
            if (window.lucide) window.lucide.createIcons();
        };
        const escapeHtml = value => String(value || '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));

        function groupNameParts(name) {
            const parts = String(name || '').trim().split(/\s+/);
            if (parts.length <= 1) {
                return { title: parts[0] || '', subtitle: '' };
            }
            return { title: parts[0], subtitle: parts.slice(1).join(' ') };
        }

        function syncSubmit() {
            const method = document.querySelector('input[name="pay_method"]:checked');
            const isGroupMode = state.mode === 'group';
            const hasGroup = Boolean(state.selectedGroup);
            const hasStudent = state.selectedStudents.length > 0;
            const hasPeriod = Boolean(state.selectedPeriod);
            const hasMethod = Boolean(method);
            const hasConsent = Boolean(consentInput.checked);

            groupStep.classList.toggle('pay-step-hidden', !isGroupMode);
            phoneStep.classList.toggle('pay-step-hidden', isGroupMode);
            phoneResults.classList.toggle('pay-step-hidden', isGroupMode || state.phoneStudents.length === 0);
            studentStep.classList.toggle('pay-step-hidden', !isGroupMode || !hasGroup);
            periodStep.classList.toggle('pay-step-hidden', !hasStudent);
            methodStep.classList.toggle('pay-step-hidden', !hasPeriod);
            consentStep.classList.toggle('pay-step-hidden', !hasMethod);
            submitBtn.classList.toggle('pay-step-hidden', !hasMethod);
            submitBtn.disabled = !((isGroupMode ? hasGroup : true) && hasStudent && hasPeriod && hasMethod && hasConsent);
        }

        function periodKey(period) {
            return `${period.year}-${String(period.month).padStart(2, '0')}`;
        }

        function periodLabel(period) {
            return `${monthNames()[period.month - 1]} ${period.year}`;
        }

        function updateLegalLinks() {
            document.querySelectorAll('.pay-legal-link').forEach(link => {
                const section = link.dataset.section || 'privacy';
                link.href = `/legal?section=${encodeURIComponent(section)}&lang=${encodeURIComponent(state.lang)}`;
            });
        }

        function applyLanguage(lang) {
            state.lang = lang === 'uz' ? 'uz' : 'ru';
            document.documentElement.lang = state.lang;
            document.querySelectorAll('[data-i18n]').forEach(node => {
                node.textContent = t(node.dataset.i18n);
            });
            document.querySelectorAll('[data-pay-lang]').forEach(button => {
                button.classList.toggle('active', button.dataset.payLang === state.lang);
            });
            const activeLangButton = document.querySelector(`[data-pay-lang="${state.lang}"]`);
            if (activeLangButton) {
                document.getElementById('pay-lang-toggle').innerHTML = activeLangButton.innerHTML;
            }
            studentInput.placeholder = state.selectedGroup ? t('studentPlaceholder') : t('studentBeforeGroup');
            updateLegalLinks();
            renderGroupCards();
            renderMethods();
            renderPhoneResults();
            renderPeriodOptions();
            renderSummary();
            syncSubmit();
            refreshIcons();
        }

        function findStudentPeriod(student, period) {
            if (!student || !period) return null;
            return (student.unpaid_periods || []).find(item => item.year === period.year && item.month === period.month) || null;
        }

        function getStudentPeriodAmount(student, period = state.selectedPeriod) {
            const found = findStudentPeriod(student, period);
            return Number(found?.amount_due || 0);
        }

        function findByName(items, value, field = 'name') {
            const normalized = (value || '').trim().toLowerCase();
            return items.find(item => String(item[field] || '').trim().toLowerCase() === normalized) || null;
        }

        function renderDropdown(box, items, field, onSelect) {
            const visible = items.slice(0, 40);
            if (!visible.length) {
                box.innerHTML = `<div class="pay-empty">${t('nothingFound')}</div>`;
                box.classList.add('open');
                return;
            }
            box.innerHTML = visible.map(item => (
                `<button class="pay-option" type="button" data-id="${item.id}">${escapeHtml(item[field])}</button>`
            )).join('');
            box.classList.add('open');
            box.querySelectorAll('.pay-option').forEach(button => {
                button.addEventListener('click', () => {
                    const item = visible.find(entry => String(entry.id) === button.dataset.id);
                    if (item) onSelect(item);
                    box.classList.remove('open');
                });
            });
        }

        function renderGroupCards() {
            if (!groupCards) return;
            if (!state.groups.length) {
                groupCards.innerHTML = `<div class="pay-empty">${t('nothingFound')}</div>`;
                return;
            }
            groupCards.innerHTML = state.groups.map(group => {
                const name = groupNameParts(group.name);
                return `
                    <button type="button" class="pay-group-card ${state.selectedGroup?.id === group.id ? 'active' : ''}" data-id="${group.id}" title="${escapeHtml(group.name)}">
                        <i data-lucide="check-circle" class="pay-group-check" aria-hidden="true"></i>
                        <i data-lucide="users" class="pay-group-icon" aria-hidden="true"></i>
                        <span class="pay-group-name">
                            <span class="pay-group-title">${escapeHtml(name.title)}</span>
                            ${name.subtitle ? `<span class="pay-group-subtitle">${escapeHtml(name.subtitle)}</span>` : ''}
                        </span>
                    </button>
                `;
            }).join('');
            groupCards.querySelectorAll('.pay-group-card').forEach(button => {
                button.addEventListener('click', () => {
                    const group = state.groups.find(item => String(item.id) === button.dataset.id);
                    if (group) selectGroup(group);
                });
            });
            refreshIcons();
        }

        function showStudentOptions(showAll = false) {
            if (studentInput.disabled) return;
            const query = showAll ? '' : studentInput.value.trim().toLowerCase();
            const items = state.students.filter(student => String(student.full_name || '').toLowerCase().includes(query));
            renderDropdown(studentList, items, 'full_name', selectStudent);
        }

        function resetPaymentProgress() {
            state.selectedStudents = [];
            state.selectedStudent = null;
            state.selectedPeriod = null;
            consentInput.checked = false;
            document.querySelectorAll('input[name="pay_method"]').forEach(input => { input.checked = false; });
            providerBox.style.display = 'none';
            providerBox.innerHTML = '';
            resultBox.textContent = '';
            resultBox.classList.remove('error');
        }

        function selectGroup(group) {
            state.selectedGroup = group;
            state.selectedStudent = null;
            state.selectedStudents = [];
            studentInput.value = '';
            resetPaymentProgress();
            renderGroupCards();
            renderSummary();
            syncSubmit();
            loadStudents(group.id);
        }

        function selectStudent(student) {
            studentInput.value = student.full_name;
            resetPaymentProgress();
            state.selectedStudent = student;
            state.selectedStudents = [student];
            renderPeriodOptions();
            renderSummary();
            syncSubmit();
        }

        function renderPhoneResults() {
            if (!state.phoneStudents.length) {
                phoneResults.innerHTML = '';
                syncSubmit();
                return;
            }
            const selectedIds = new Set(state.selectedStudents.map(student => student.id));
            phoneResults.innerHTML = state.phoneStudents.map(student => `
                <label class="pay-student-pick">
                    <input type="checkbox" value="${student.id}" ${selectedIds.has(student.id) ? 'checked' : ''}>
                    <span class="pay-student-pick-main">
                        <span class="pay-student-pick-name">${escapeHtml(student.full_name)}</span>
                        <span class="pay-student-pick-meta">${escapeHtml(student.group_name || t('noGroup'))} · ${escapeHtml(student.tariff.name)}</span>
                    </span>
                    <span class="pay-student-pick-amount">${(student.unpaid_periods || []).length ? `${(student.unpaid_periods || []).length} ${t('monthsShort')}` : t('paid')}</span>
                </label>
            `).join('');
            phoneResults.querySelectorAll('input[type="checkbox"]').forEach(input => {
                input.addEventListener('change', () => {
                    const ids = new Set(Array.from(phoneResults.querySelectorAll('input[type="checkbox"]:checked')).map(item => Number(item.value)));
                    state.selectedStudents = state.phoneStudents.filter(student => ids.has(student.id));
                    state.selectedPeriod = null;
                    document.querySelectorAll('input[name="pay_method"]').forEach(item => { item.checked = false; });
                    consentInput.checked = false;
                    renderPeriodOptions();
                    renderSummary();
                    syncSubmit();
                });
            });
            syncSubmit();
        }

        function renderPeriodOptions() {
            state.selectedPeriod = null;
            if (!state.selectedStudents.length) {
                periodSelect.innerHTML = '';
                syncSubmit();
                return;
            }

            const periods = new Map();
            state.selectedStudents.forEach(student => {
                (student.unpaid_periods || []).forEach(period => {
                    const key = periodKey(period);
                    if (!periods.has(key)) {
                        periods.set(key, { year: period.year, month: period.month });
                    }
                });
            });
            const sorted = Array.from(periods.values()).sort((a, b) => (
                a.year === b.year ? a.month - b.month : a.year - b.year
            ));

            if (!sorted.length) {
                periodSelect.innerHTML = `<option value="">${t('noUnpaid')}</option>`;
                renderSummary();
                syncSubmit();
                return;
            }

            periodSelect.innerHTML = `<option value="">${t('chooseMonth')}</option>` + sorted.map(period => (
                `<option value="${periodKey(period)}">${periodLabel(period)}</option>`
            )).join('');
            syncSubmit();
        }

        function renderMethods() {
            methodsBox.innerHTML = state.methods.map(method => `
                <label class="pay-method ${method.enabled ? '' : 'disabled'}">
                    <input type="radio" name="pay_method" value="${method.key}" ${method.enabled ? '' : 'disabled'}>
                    ${method.logo_url ? `<img class="pay-method-logo" src="${method.logo_url}" alt="">` : ''}
                    <span class="pay-method-name">${method.name}${method.enabled ? '' : t('soon')}</span>
                </label>
            `).join('');
            methodsBox.querySelectorAll('input').forEach(input => input.addEventListener('change', syncSubmit));
        }

        function renderSummary() {
            if (!state.selectedStudents.length) {
                summaryBox.style.display = 'none';
                summaryBox.innerHTML = '';
                return;
            }
            if (!state.selectedPeriod) {
                summaryBox.style.display = 'none';
                summaryBox.innerHTML = '';
                return;
            }
            summaryBox.style.display = 'grid';
            const total = state.selectedStudents.reduce((sum, student) => sum + getStudentPeriodAmount(student), 0);
            if (state.selectedStudents.length === 1) {
                const s = state.selectedStudents[0];
                summaryBox.innerHTML = `
                    <div class="pay-summary-row"><span>${t('month')}</span><strong>${periodLabel(state.selectedPeriod)}</strong></div>
                    <div class="pay-summary-row"><span>${t('tariff')}</span><strong>${s.tariff.name}</strong></div>
                    <div class="pay-summary-row"><span>${t('amountDue')}</span><strong>${money(total)}</strong></div>
                `;
                return;
            }
            summaryBox.innerHTML = `
                <div class="pay-summary-row"><span>${t('month')}</span><strong>${periodLabel(state.selectedPeriod)}</strong></div>
                ${state.selectedStudents.map(student => `
                    <div class="pay-summary-row"><span>${escapeHtml(student.full_name)}</span><strong>${money(getStudentPeriodAmount(student))}</strong></div>
                `).join('')}
                <div class="pay-summary-row"><span>${t('amountDue')}</span><strong>${money(total)}</strong></div>
            `;
        }

        async function loadOptions() {
            const response = await fetch('/api/pay/options');
            const data = await response.json();
            state.groups = data.groups || [];
            state.methods = data.methods || [];
            renderGroupCards();
            renderMethods();
            syncSubmit();
        }

        async function loadStudents(groupId) {
            state.selectedStudent = null;
            state.selectedStudents = [];
            renderSummary();
            studentInput.disabled = true;
            studentInput.value = '';
            studentInput.placeholder = t('studentLoading');
            studentList.innerHTML = '';
            const response = await fetch(`/api/pay/students?group_id=${encodeURIComponent(groupId)}`);
            const data = await response.json();
            state.students = data.students || [];
            studentInput.disabled = false;
            studentInput.placeholder = t('studentPlaceholder');
            syncSubmit();
        }

        async function searchStudentsByPhone() {
            const digits = phoneInput.value.replace(/\D/g, '');
            state.phoneStudents = [];
            state.selectedStudents = [];
            state.selectedPeriod = null;
            renderSummary();
            renderPhoneResults();
            if (digits.length < 9) {
                syncSubmit();
                return;
            }
            phoneResults.innerHTML = `<div class="pay-empty">${t('searching')}</div>`;
            phoneResults.classList.remove('pay-step-hidden');
            const response = await fetch(`/api/pay/students-by-phone?phone=${encodeURIComponent(phoneInput.value)}`);
            const data = await response.json();
            if (!data.success) {
                phoneResults.innerHTML = `<div class="pay-empty">${escapeHtml(data.message || t('nothingFound'))}</div>`;
                syncSubmit();
                return;
            }
            state.phoneStudents = data.students || [];
            if (!state.phoneStudents.length) {
                phoneResults.innerHTML = `<div class="pay-empty">${t('noStudentsPhone')}</div>`;
                syncSubmit();
                return;
            }
            if (state.phoneStudents.length === 1) {
                state.selectedStudents = [state.phoneStudents[0]];
            }
            renderPhoneResults();
            renderPeriodOptions();
            renderSummary();
            syncSubmit();
        }

        function ensureUzPhonePrefix(input) {
            if (!input.value.trim()) {
                input.value = '+998 ';
                return;
            }
            const digits = input.value.replace(/\D/g, '');
            if (digits && !digits.startsWith('998') && digits.length <= 9) {
                input.value = `+998 ${digits}`;
            }
        }

        function switchLookupMode(mode) {
            state.mode = mode;
            state.selectedGroup = null;
            state.selectedStudent = null;
            state.selectedStudents = [];
            state.phoneStudents = [];
            studentInput.value = '';
            studentInput.disabled = true;
            studentInput.placeholder = t('studentBeforeGroup');
            phoneInput.value = '+998 ';
            phoneResults.innerHTML = '';
            resetPaymentProgress();
            renderGroupCards();
            renderSummary();
            syncSubmit();
        }

        function handlePeriodChange() {
            const value = periodSelect.value;
            state.selectedPeriod = null;
            document.querySelectorAll('input[name="pay_method"]').forEach(item => { item.checked = false; });
            consentInput.checked = false;
            if (value) {
                const [year, month] = value.split('-').map(Number);
                state.selectedPeriod = { year, month };
            }
            renderSummary();
            syncSubmit();
        }

        studentInput.addEventListener('input', () => {
            const student = findByName(state.students, studentInput.value, 'full_name');
            resetPaymentProgress();
            if (student) {
                selectStudent(student);
                studentList.classList.remove('open');
                return;
            }
            state.selectedStudent = null;
            renderSummary();
            syncSubmit();
            showStudentOptions();
        });

        studentInput.addEventListener('focus', () => showStudentOptions(true));
        studentInput.addEventListener('click', () => showStudentOptions(Boolean(state.selectedStudent)));

        document.querySelectorAll('input[name="pay_lookup_mode"]').forEach(input => {
            input.addEventListener('change', () => switchLookupMode(input.value));
        });
        document.querySelectorAll('[data-pay-lang]').forEach(button => {
            button.addEventListener('click', () => {
                applyLanguage(button.dataset.payLang);
                document.querySelector('.pay-lang').classList.remove('open');
                document.getElementById('pay-lang-toggle').setAttribute('aria-expanded', 'false');
            });
        });
        document.getElementById('pay-lang-toggle').addEventListener('click', () => {
            const langBox = document.querySelector('.pay-lang');
            const isOpen = langBox.classList.toggle('open');
            document.getElementById('pay-lang-toggle').setAttribute('aria-expanded', String(isOpen));
        });
        periodSelect.addEventListener('change', handlePeriodChange);
        phoneInput.addEventListener('focus', () => ensureUzPhonePrefix(phoneInput));
        phoneInput.addEventListener('input', () => {
            ensureUzPhonePrefix(phoneInput);
            window.clearTimeout(phoneInput._paySearchTimer);
            phoneInput._paySearchTimer = window.setTimeout(searchStudentsByPhone, 350);
        });

        document.addEventListener('click', event => {
            if (!event.target.closest('.pay-combobox')) {
                studentList.classList.remove('open');
            }
            if (!event.target.closest('.pay-lang')) {
                document.querySelector('.pay-lang').classList.remove('open');
                document.getElementById('pay-lang-toggle').setAttribute('aria-expanded', 'false');
            }
        });

        consentInput.addEventListener('change', syncSubmit);

        document.getElementById('pay-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            resultBox.textContent = '';
            resultBox.classList.remove('error');
            providerBox.style.display = 'none';
            providerBox.innerHTML = '';
            const method = document.querySelector('input[name="pay_method"]:checked');
            const response = await fetch('/api/pay/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_ids: state.selectedStudents.map(student => student.id),
                    month: Number(state.selectedPeriod?.month),
                    year: Number(state.selectedPeriod?.year),
                    method: method?.value,
                    accepted_terms: consentInput.checked
                })
            });
            const data = await response.json();
            if (!data.success) {
                resultBox.textContent = data.message || t('checkoutFailed');
                resultBox.classList.add('error');
                return;
            }
            const checkout = data.checkout;
            resultBox.textContent = data.message;
            providerBox.style.display = 'block';
            providerBox.innerHTML = `
                <strong>${checkout.method.name}: ${money(checkout.amount)}</strong>
                ${checkout.students && checkout.students.length > 1 ? `<div class="pay-note">${checkout.students.map(item => `${escapeHtml(item.student_name)} - ${money(item.amount)}`).join('<br>')}</div>` : ''}
                <div class="pay-note">${t('providerNote')}</div>
                ${checkout.method.qr_url ? `<img src="${checkout.method.qr_url}" alt="${checkout.method.name} QR">` : ''}
            `;
        });

        applyLanguage('ru');
        loadOptions().catch(() => {
            resultBox.textContent = t('checkoutFailed');
            resultBox.classList.add('error');
        });
    </script>
</body>

</html>
