<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Касса</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon.png') }}">
    {% include '_pwa_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2026111001">
</head>
<body>
    {% include '_sidebar.html' %}

    <div class="main-content">
        <div class="page-header">
            <h1>💵 Касса</h1>
            <div style="display: flex; gap: 12px; align-items: center;">
                <button id="cashFilterToggleBtn" class="btn-secondary" style="display: flex; align-items: center; gap: 8px;" title="Фильтр" aria-label="Фильтр">
                    <svg class="filter-toggle-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 5h18" />
                        <path d="M6 12h12" />
                        <path d="M10 19h4" />
                    </svg>
                    <span id="cashFilterToggleText" class="visually-hidden">Фильтр</span>
                </button>
                <button id="addTransferBtn" class="btn-primary"><span class="btn-plus" aria-hidden="true">+</span> Добавить</button>
            </div>
        </div>

        <!-- Фильтры -->
        <div id="cashFilterPanel" class="filter-panel" style="display: none;">
            <div class="filter-panel-content">
                <div class="filter-row">
                    <div class="filter-group">
                        <label>📅 От даты</label>
                        <input type="date" id="cash-date-from" class="form-input-modern">
                    </div>
                    <div class="filter-group">
                        <label>📅 До даты</label>
                        <input type="date" id="cash-date-to" class="form-input-modern">
                    </div>
                    <div class="filter-group">
                        <label>👤 Управляющий</label>
                        <input type="text" id="cash-recipient-filter" placeholder="Поиск по имени..." class="form-input-modern">
                    </div>
                </div>
                <div class="filter-actions">
                    <button type="button" onclick="resetCashFilters()" class="btn-secondary">🔄 Сбросить</button>
                    <button type="button" onclick="applyCashFilters()" class="btn-primary">✓ Применить</button>
                </div>
            </div>
        </div>

        <!-- Таблица передач -->
        <table class="data-table">
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Управляющий</th>
                    <th>Сумма</th>
                    <th>Примечание</th>
                    <th>Создал</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="cash-transfers-table-body">
                <tr><td colspan="6" class="info-text">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Модальное окно добавления/редактирования передачи -->
    <div id="transferModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header-fixed">
                <h2 id="transferModalTitle">Добавить передачу денег</h2>
                <div class="modal-header-actions">
                    <button type="button" onclick="closeTransferModal()" class="btn-secondary">Отмена</button>
                    <button type="submit" form="transferForm" class="btn-primary">Сохранить</button>
                </div>
            </div>
            <div class="modal-body-scrollable">
                <form id="transferForm">
                    <input type="hidden" id="edit-transfer-id">
                    
                    <div class="form-group">
                        <label>Остаток кассы</label>
                        <input type="text" id="transfer-balance" class="form-input-modern" readonly style="background: #f5f5f5;">
                        <small style="color: #666; font-size: 12px;">Автоматически рассчитанная сумма остатка</small>
                    </div>
                    
                    <div class="form-group">
                        <label>Сумма передачи *</label>
                        <input type="text" id="transfer-amount" class="form-input-modern" inputmode="decimal" autocomplete="off" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Управляющий *</label>
                        <input type="text" id="transfer-recipient" class="form-input-modern" required placeholder="Введите имя управляющего" value="Жавлон ака">
                    </div>
                    
                    <div class="form-group">
                        <label>Дата передачи</label>
                        <input type="date" id="transfer-date" class="form-input-modern" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Примечание</label>
                        <textarea id="transfer-notes" class="form-input-modern" rows="3" placeholder="Дополнительная информация"></textarea>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/cash.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}?v=2026080801"></script>
</body>
</html>
