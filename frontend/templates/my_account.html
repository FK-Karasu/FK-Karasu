<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мой аккаунт - {{ system_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon.png') }}">
    {% include '_pwa_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2026110201">
    <style>
        body { background: #f7f4f1; }
        body .main-content.game-main-content {
            background: #f7f4f1 !important;
        }
        .account-shell {
            min-height: 100vh;
            max-width: 1220px;
            margin: 0 auto;
            padding: 24px 20px 44px;
            background: #f7f4f1;
        }
        .account-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }
        .account-header h1 {
            margin: 0;
            color: #0f172a;
            font-size: 25px;
            letter-spacing: 0;
        }
        .account-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }
        .account-stack {
            display: grid;
            gap: 18px;
            min-width: 0;
        }
        .account-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .account-panel {
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #fff;
            padding: 18px 18px 20px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, .045);
        }
        .account-panel h2 {
            margin: 0 0 14px;
            color: #0f172a;
            font-size: 18px;
            letter-spacing: 0;
        }
        .account-avatar {
            display: flex;
            justify-content: flex-start;
        }
        .account-avatar-frame {
            position: relative;
            width: 126px;
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #e4ddd6;
            background: #f8f7f6;
        }
        .account-avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .account-avatar-frame input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .account-avatar-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, .46);
            opacity: 0;
            transition: opacity .18s ease;
        }
        .account-avatar-frame:hover .account-avatar-overlay,
        .account-avatar-frame:focus-within .account-avatar-overlay {
            opacity: 1;
        }
        .account-avatar-pick {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 14px;
            border: 1px solid rgba(255, 255, 255, .72);
            border-radius: 999px;
            background: rgba(255, 255, 255, .92);
            color: #0f172a;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .account-avatar-reset {
            position: absolute;
            top: 10px;
            right: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: rgba(15, 23, 42, .82);
            color: #fff;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: opacity .18s ease, transform .18s ease;
        }
        .account-avatar-frame:hover .account-avatar-reset,
        .account-avatar-frame:focus-within .account-avatar-reset {
            opacity: 1;
        }
        .account-avatar-reset:hover {
            transform: scale(1.06);
        }
        .account-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 13px 14px;
        }
        .account-profile-top {
            display: grid;
            grid-template-columns: 126px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }
        .account-profile-fields {
            min-width: 0;
        }
        .account-form .full { grid-column: 1 / -1; }
        .account-form label {
            display: grid;
            gap: 7px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }
        .account-form input,
        .account-form select {
            width: 100%;
            min-height: 40px;
            border: 1px solid #d8d0c8;
            border-radius: 8px;
            padding: 0 12px;
            background: #fff;
            color: #0f172a;
            font-size: 14px;
        }
        .account-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }
        .account-status {
            min-height: 20px;
            margin-top: 12px;
            color: #64748b;
            font-size: 13px;
        }
        .account-status.error { color: #dc2626; }
        .account-status.success { color: #059669; }
        .account-readonly {
            min-height: 40px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #f8f7f6;
            color: #475569;
            font-size: 14px;
        }
        .account-actions .btn-primary:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .account-security-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .google-state {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 0 10px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #475569;
            font-size: 13px;
            font-weight: 700;
        }
        @media (max-width: 900px) {
            .account-shell { padding: 16px 12px 92px; }
            .account-grid,
            .account-form,
            .account-profile-top,
            .account-security-grid { grid-template-columns: 1fr; }
            .account-header h1 { font-size: 24px; }
            .account-avatar { justify-content: center; }
        }
    </style>
</head>

<body>
    {% include '_sidebar.html' %}
    <main class="main-content game-main-content">
        <div class="account-shell">
            <div class="account-header">
                <h1>Мой аккаунт</h1>
                <div class="account-header-actions">
                    <span class="google-state" id="account-google-state">Google: ...</span>
                    <a class="btn-secondary" href="{{ url_for('logout') }}">Выход</a>
                </div>
            </div>

            <div class="account-grid">
                <div class="account-stack">
                    <section class="account-panel">
                        <h2>Основная информация</h2>
                        <form id="account-form">
                            <div class="account-profile-top">
                                <div class="account-avatar">
                                    <div class="account-avatar-frame">
                                        <img id="account-avatar-img" alt="Аватар" src="{{ url_for('static', filename='uploads/avatar_ccount.png') }}">
                                        <input id="account-photo" type="file" accept="image/*">
                                        <div class="account-avatar-overlay">
                                            <label class="account-avatar-pick" for="account-photo">Выбрать</label>
                                        </div>
                                        <button id="account-remove-photo" class="account-avatar-reset" type="button" aria-label="Сбросить фото">&times;</button>
                                    </div>
                                </div>
                                <div class="account-form account-profile-fields">
                                    <label>
                                        ФИО
                                        <input id="account-full-name" type="text" autocomplete="name">
                                    </label>
                                    <label>
                                        Логин
                                        <span id="account-username" class="account-readonly"></span>
                                    </label>
                                    <label>
                                        Номер телефона
                                        <input id="account-phone" type="tel" autocomplete="tel">
                                    </label>
                                    <label>
                                        Электронная почта
                                        <input id="account-email" type="email" autocomplete="email">
                                    </label>
                                    <label class="full">
                                        Роль
                                        <span id="account-role" class="account-readonly"></span>
                                    </label>
                                </div>
                            </div>
                            <div class="account-actions">
                                <button class="btn-primary" id="account-save-btn" type="submit" disabled>Сохранить</button>
                            </div>
                            <div id="account-status" class="account-status"></div>
                        </form>
                    </section>

                    <section class="account-panel">
                        <h2>Безопасность</h2>
                        <form id="password-form">
                            <div class="account-form account-security-grid">
                                <label>
                                    Текущий пароль
                                    <input id="current-password" type="password" autocomplete="current-password">
                                </label>
                                <label>
                                    Новый пароль
                                    <input id="new-password" type="password" autocomplete="new-password">
                                </label>
                                <label>
                                    Подтвердить пароль
                                    <input id="confirm-password" type="password" autocomplete="new-password">
                                </label>
                            </div>
                            <div class="account-actions">
                                <button class="btn-primary" id="password-save-btn" type="submit" disabled>Изменить пароль</button>
                            </div>
                            <div id="password-status" class="account-status"></div>
                        </form>
                    </section>
                </div>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/my_account.js') }}"></script>
    <script src="{{ url_for('static', filename='js/service-lock-overlay.js') }}"></script>
</body>

</html>
